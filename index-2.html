<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>犬川地区</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                   "Yu Gothic", Meiryo, sans-serif;
      background: #ffffff;
      color: #222;
    }

    .page {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
    }

    /* トップ4枚：1080×600比率 */
    .hero {
      position: relative;
      width: 100%;
      aspect-ratio: 1080 / 600;
      overflow: hidden;
      background: #f2f2f2;
    }

    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .hero img.active {
      opacity: 1;
    }

    .banners {
      padding: 18px 14px 26px;
      display: grid;
      gap: 14px;
    }

    .banner {
      display: block;
      width: 100%;
      text-decoration: none;
      border-radius: 12px;
      overflow: hidden;
    }

    .banner img {
      display: block;
      width: 100%;
      height: auto;
    }

    footer {
      padding: 28px 20px 34px;
      background: #f5f5f5;
      color: #333;
      text-align: center;
      line-height: 1.8;
      font-size: 14px;
    }

    footer .name {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 8px;
    }

    footer .address {
      margin-top: 12px;
    }

    @media (min-width: 768px) {
      .banners {
        padding: 24px 24px 34px;
        gap: 18px;
      }
      footer {
        font-size: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero img { transition: none; }
    }
  </style>
</head>
<body>

  <main class="page">

    <!-- トップ写真 4枚：自動フェード -->
    <section class="hero" aria-label="犬川地区メインビジュアル">
      <img src="top1.png" alt="" class="active">
      <img src="top2.png" alt="">
      <img src="top3.png" alt="">
      <img src="top4.png" alt="">
    </section>

    <!-- バナー -->
    <section class="banners">

      <!-- アンケート：後で survey.html を作ればそのまま接続 -->
      <a class="banner" href="survey.html">
        <img src="inukawaank.png" alt="アンケート">
      </a>

      <!-- 犬川地区HP：現在は仮リンク -->
      <a class="banner"
         href="https://www.instagram.com/nanyo_fc?igsi=OWNlaGoyNTU3djF2"
         target="_blank" rel="noopener noreferrer">
        <img src="inukawahp.png" alt="犬川地区ホームページ">
      </a>

      <!-- 犬川地区Instagram -->
      <a class="banner"
         href="https://www.instagram.com/inukawaegube?igsi=MXhkbXQ4dmdpdjJvcw=="
         target="_blank" rel="noopener noreferrer">
        <img src="inukawains.png" alt="犬川地区Instagram">
      </a>

      <!-- 川西町HP -->
      <a class="banner"
         href="https://www.town.kawanishi.yamagata.jp/"
         target="_blank" rel="noopener noreferrer">
        <img src="kawanishihp.png" alt="川西町ホームページ">
      </a>

    </section>

    <footer>
      <div class="name">
        いぬかわ地域振興協議会<br>
        川西町犬川地区交流センター
      </div>

      <div class="address">
        〒999-0013<br>
        山形県東置賜郡川西町大字小松614-2
      </div>

      <div>
        [TEL]&nbsp; 0238-42-2462<br>
        [FAX]&nbsp; 0238-42-2664
      </div>
    </footer>

  </main>

  <script>
    (() => {
      const slides = Array.from(document.querySelectorAll(".hero img"));
      let current = 0;

      if (slides.length <= 1) return;

      setInterval(() => {
        slides[current].classList.remove("active");
        current = (current + 1) % slides.length;
        slides[current].classList.add("active");
      }, 4000);
    })();
  </script>

</body>
</html>
