<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>いぬかわ発見！アンケートガチャ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      background: #fff;
      color: #222;
    }

    .page {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      background: #fff;
      overflow: hidden;
    }

    /* =========================
       ヘッダー画像
       ========================= */

    .campaign-header {
      position: relative;
      width: 100%;
      background: #09bce8;
    }

    .campaign-header > img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* =========================
       ヘッダーメニュー 5個
       he.png 下部の空白スペース
       ========================= */

    .header-menu {
      position: absolute;

      left: 1.5%;
      right: 1.5%;
      bottom: 3%;

      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;

      align-items: center;
    }

    .header-menu a {
      display: flex;
      align-items: center;
      justify-content: center;

      min-width: 0;
      min-height: 38px;

      padding: 5px 2px;

      background: rgba(255, 255, 255, 0.95);
      border: 1.5px solid #111;
      border-radius: 8px;

      color: #111;
      text-decoration: none;
      text-align: center;

      font-size: clamp(9px, 2.2vw, 14px);
      font-weight: 800;
      line-height: 1.05;

      box-shadow: 0 2px 4px rgba(0,0,0,.18);
    }

    .header-menu a:active {
      transform: scale(0.97);
    }

    /* =========================
       トップ4枚フェード
       ========================= */

    .hero {
      position: relative;
      width: 100%;
      aspect-ratio: 1080 / 600;
      overflow: hidden;
      background: #f2f2f2;
    }

    .hero img {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .hero img.active {
      opacity: 1;
    }

    /* =========================
       バナー
       ========================= */

    .banners {
      padding: 18px 14px 26px;

      display: grid;
      gap: 14px;
    }

    .banner {
      display: block;
      width: 100%;

      border-radius: 12px;
      overflow: hidden;

      text-decoration: none;
    }

    .banner img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* =========================
       フッター
       ========================= */

    footer {
      padding: 28px 20px 34px;

      background: #f5f5f5;
      color: #333;

      text-align: center;
      line-height: 1.8;
      font-size: 14px;
    }

    footer .name {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 8px;
    }

    footer .address {
      margin-top: 12px;
    }

    /* =========================
       スマホ調整
       ========================= */

    @media (max-width: 430px) {

      .header-menu {
        left: 1%;
        right: 1%;
        bottom: 2%;
        gap: 3px;
      }

      .header-menu a {
        min-height: 34px;
        padding: 3px 1px;

        font-size: 8.5px;
        border-radius: 6px;
      }

    }

    @media (prefers-reduced-motion: reduce) {
      .hero img {
        transition: none;
      }
    }

  </style>
</head>

  <!-- =========================
       トップ画像フェード
       ========================= -->

  <script>

    (() => {

      const slides =
        Array.from(
          document.querySelectorAll(".hero img")
        );

      let current = 0;

      if (slides.length <= 1) {
        return;
      }

      setInterval(() => {

        slides[current]
          .classList
          .remove("active");

        current =
          (current + 1) % slides.length;

        slides[current]
          .classList
          .add("active");

      }, 4000);

    })();

  </script>
