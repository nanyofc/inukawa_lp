<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>いぬかわ発見！アンケートガチャ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;

      background: #fff;
      color: #222;
    }

    .page {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      background: #fff;
      overflow: hidden;
    }

    /* =========================
       ヘッダー画像 + メニュー
       ========================= */

    .campaign-header {
      position: relative;
      width: 100%;
      background: #fff;
    }

    .campaign-header img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* he.pngの一番下の空白部分にメニューを配置 */
    .header-menu {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;

      height: 20%;

      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;

      padding: 0 2%;
    }

    .header-menu a {
      color: #111;
      text-decoration: none;
      text-align: center;

      font-size: clamp(11px, 3vw, 16px);
      font-weight: 800;
      line-height: 1.2;

      background: transparent;
      border: none;
      border-radius: 0;

      padding: 0 2px;
      white-space: nowrap;
    }

    /* =========================
       トップ4枚フェード
       ========================= */

    .hero {
      position: relative;
      width: 100%;
      aspect-ratio: 1080 / 600;

      overflow: hidden;
      background: #f2f2f2;
    }

    .hero img {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .hero img.active {
      opacity: 1;
    }

    /* =========================
       バナー
       ========================= */

    .banners {
      padding: 18px 14px 26px;

      display: grid;
      gap: 14px;
    }

    .banner {
      display: block;
      width: 100%;

      border-radius: 12px;
      overflow: hidden;

      text-decoration: none;
    }

    .banner img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* =========================
       フッター
       ========================= */

    footer {
      padding: 28px 20px 34px;

      background: #f5f5f5;
      color: #333;

      text-align: center;
      line-height: 1.8;
      font-size: 14px;
    }

    footer .name {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 8px;
    }

    footer .address {
      margin-top: 12px;
    }

    /* スマホ調整 */
    @media (max-width: 430px) {
      .header-menu a {
        font-size: 11px;
      }
    }

    /* 動きを減らす設定 */
    @media (prefers-reduced-motion: reduce) {
      .hero img {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- =========================
         ヘッダー
         ========================= -->

    <header class="campaign-header">

      <img
        src="he.png"
        alt="上野でゾクッと発見！その先に、まだ知らないいぬかわがある。スマホで楽々アンケートガチャ"
      >

      <!-- he.pngの下の空白スペースに重なるメニュー -->
      <nav class="header-menu" aria-label="メインメニュー">

        <a href="survey.html">
          アンケート
        </a>

        <a
          href="https://www.instagram.com/nanyo_fc?igsi=OWNlaGoyNTU3djF2"
          target="_blank"
          rel="noopener noreferrer"
        >
          犬川HP
        </a>

        <a
          href="https://www.instagram.com/inukawaegube?igsi=MXhkbXQ4dmdpdjJvcw=="
          target="_blank"
          rel="noopener noreferrer"
        >
          Instagram
        </a>

        <a
          href="https://www.town.kawanishi.yamagata.jp/"
          target="_blank"
          rel="noopener noreferrer"
        >
          川西町HP
        </a>

      </nav>

    </header>

    <!-- =========================
         トップ写真4枚
         ========================= -->

    <section class="hero" aria-label="犬川地区メインビジュアル">

      <img src="top1.png" alt="" class="active">
      <img src="top2.png" alt="">
      <img src="top3.png" alt="">
      <img src="top4.png" alt="">

    </section>

    <!-- =========================
         バナー
         ========================= -->

    <section class="banners">

      <a
        class="banner"
        href="survey.html"
      >
        <img
          src="inukawaank.png"
          alt="アンケート"
        >
      </a>

      <a
        class="banner"
        href="https://www.instagram.com/nanyo_fc?igsi=OWNlaGoyNTU3djF2"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          src="inukawahp.png"
          alt="犬川地区ホームページ"
        >
      </a>

      <a
        class="banner"
        href="https://www.instagram.com/inukawaegube?igsi=MXhkbXQ4dmdpdjJvcw=="
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          src="inukawains.png"
          alt="犬川地区Instagram"
        >
      </a>

      <a
        class="banner"
        href="https://www.town.kawanishi.yamagata.jp/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          src="kawanishihp.png"
          alt="川西町ホームページ"
        >
      </a>

    </section>

    <!-- =========================
         フッター
         ========================= -->

    <footer>

      <div class="name">
        いぬかわ地域振興協議会<br>
        川西町犬川地区交流センター
      </div>

      <div class="address">
        〒999-0013<br>
        山形県東置賜郡川西町大字小松614-2
      </div>

      <div>
        [TEL]&nbsp; 0238-42-2462<br>
        [FAX]&nbsp; 0238-42-2664
      </div>

    </footer>

  </main>

  <script>
    (() => {

      const slides = Array.from(
        document.querySelectorAll(".hero img")
      );

      let current = 0;

      if (slides.length <= 1) {
        return;
      }

      setInterval(() => {

        slides[current].classList.remove("active");

        current =
          (current + 1) % slides.length;

        slides[current].classList.add("active");

      }, 4000);

    })();
  </script>

</body>
</html>
