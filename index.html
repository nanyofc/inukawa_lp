<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>いぬかわ賑わいプロジェクト</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;

      background: #ffffff;
      color: #222;
    }

    .page {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
    }


    /* ==================================================
       ヘッダー
       ================================================== */

    .campaign-header {
      position: relative;
      width: 100%;
      background: #09bce8;
    }

    .campaign-header > img {
      display: block;
      width: 100%;
      height: auto;
    }


    /* ==================================================
       ヘッダーメニュー
       ================================================== */

    .header-menu {
      position: absolute;

      left: 1.5%;
      right: 1.5%;
      bottom: 3%;

      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      gap: 5px;
    }

    .header-menu a {
      display: flex;

      align-items: center;
      justify-content: center;

      min-width: 0;
      min-height: 38px;

      padding: 5px 2px;

      border: 1.5px solid #111;

      border-radius: 8px;

      background:
        rgba(255,255,255,.95);

      color: #111;

      text-decoration: none;
      text-align: center;

      font-size:
        clamp(9px, 2.2vw, 14px);

      font-weight: 800;
      line-height: 1.05;

      box-shadow:
        0 2px 4px rgba(0,0,0,.18);
    }

    .header-menu a:active {
      transform: scale(.97);
    }


    /* ==================================================
       トップ画像4枚フェード
       ================================================== */

    .hero {
      position: relative;

      width: 100%;

      aspect-ratio:
        1080 / 600;

      overflow: hidden;

      background: #f2f2f2;
    }

    .hero img {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      opacity: 0;

      transition:
        opacity 1s ease-in-out;
    }

    .hero img.active {
      opacity: 1;
    }


    /* ==================================================
       バナー
       ================================================== */

    .banners {
      padding:
        18px 14px 26px;

      display: grid;

      gap: 14px;
    }

    .banner {
      display: block;

      width: 100%;

      border-radius: 12px;

      overflow: hidden;

      text-decoration: none;
    }

    .banner img {
      display: block;

      width: 100%;
      height: auto;
    }


    /* ==================================================
       フッター
       ================================================== */

    footer {
      padding:
        28px 20px 34px;

      background: #f5f5f5;

      color: #333;

      text-align: center;

      line-height: 1.8;

      font-size: 14px;
    }

    footer .name {
      margin-bottom: 8px;

      font-size: 16px;

      font-weight: 700;
    }

    footer .address {
      margin-top: 12px;
    }


    /* ==================================================
       スマホ
       ================================================== */

    @media (max-width: 430px) {

      .header-menu {
        left: 1%;
        right: 1%;
        bottom: 2%;

        gap: 3px;
      }

      .header-menu a {
        min-height: 34px;

        padding:
          3px 1px;

        border-radius: 6px;

        font-size: 8.5px;
      }
    }


    @media (
      prefers-reduced-motion:
      reduce
    ) {

      .hero img {
        transition: none;
      }
    }

  </style>
</head>


<body>

  <main class="page">


    <!-- ==================================================

    <!-- ==================================================

      <img

    <!-- ==================================================

         ================================================== -->

    <section class="banners">


      <!-- アンケート -->

      <a

        <img

      <!-- 犬川地区HP -->

      <a

        target="_blank"

        <img

      <!-- 犬川地区Instagram -->

      <!-- 川西町HP -->

      <div>

        [TEL]&nbsp; 0238-42-2462<br>

        [FAX]&nbsp; 0238-42-2664

    </footer>

  </main>



  <script>

    /* ==================================================
       テスト ON / OFF

       false
       ↓
       本番モード
       9/20・9/21の指定時間だけ
       アンケートへ進める

       true
       ↓
       テストモード
       日時を無視してアンケートへ進める

       ★本番では false
       ================================================== */

    const DEMO_MODE = false;



    /* ==================================================
       本番受付時間

       9月20日（日）
       13:00 ～ 17:30

       9月21日（月・祝）
       10:00 ～ 17:30

       日本時間
       ================================================== */

    const SURVEY_WINDOWS = [

      {

        start:
          new Date(
            "2026-09-20T13:00:00+09:00"
          ),

        end:
          new Date(
            "2026-09-20T17:30:00+09:00"
          ),

        label:
          "9月20日（日）13:00〜17:30"

      },


      {

        start:
          new Date(
            "2026-09-21T10:00:00+09:00"
          ),

        end:
          new Date(
            "2026-09-21T17:30:00+09:00"
          ),

        label:
          "9月21日（月・祝）10:00〜17:30"

      }

    ];



    /* ==================================================
       受付状態判定
       ================================================== */

    function getSurveyStatus() {


      /* テストON */

      if (
        DEMO_MODE === true
      ) {

        return {
          status: "open",
          nextLabel: ""
        };

      }


      const now =
        new Date();



      /* 現在受付中か */

      for (
        const item
        of SURVEY_WINDOWS
      ) {

        if (
          now >= item.start &&
          now < item.end
        ) {

          return {
            status: "open",
            nextLabel: item.label
          };

        }

      }



      /* 次の開催時間 */

      const nextWindow =
        SURVEY_WINDOWS.find(
          item =>
            now < item.start
        );


      if (
        nextWindow
      ) {

        return {
          status: "before",
          nextLabel:
            nextWindow.label
        };

      }



      /* 全日程終了 */

      return {
        status: "after",
        nextLabel: ""
      };

    }



    /* ==================================================
       アンケート入口制御

       アンケートだけ時間制御

       犬川地区HP
       犬川地区Instagram
       川西町HP
       上野ゾク夏祭り

       ↑は時間外でも常時利用可能
       ================================================== */

    document
      .querySelectorAll(
        ".survey-link"
      )
      .forEach(
        link => {

          link.addEventListener(
            "click",
            event => {


              const result =
                getSurveyStatus();



              /* 受付開始前 */

              if (
                result.status ===
                "before"
              ) {

                event.preventDefault();


                alert(

                  "アンケートガチャはまだ受付開始前です。\n\n" +

                  "次回の受付時間\n" +

                  result.nextLabel

                );


                return;

              }



              /* 全日程終了 */

              if (
                result.status ===
                "after"
              ) {

                event.preventDefault();


                alert(

                  "アンケートガチャの受付は終了しました。\n\n" +

                  "ご参加ありがとうございました。"

                );


                return;

              }



              /* 受付中
                 ↓
                 survey.htmlへ進む */

            }
          );

        }
      );



    /* ==================================================
       トップ画像4枚フェード
       ================================================== */

    (() => {


      const slides =
        Array.from(

          document.querySelectorAll(
            ".hero img"
          )

        );


      let current = 0;


      if (
        slides.length <= 1
      ) {

        return;

      }


      setInterval(
        () => {

          slides[current]
            .classList
            .remove(
              "active"
            );


          current =
            (
              current + 1
            ) %
            slides.length;


          slides[current]
            .classList
            .add(
              "active"
            );

        },

        4000

      );

    })();

  </script>

</body>

</html>
