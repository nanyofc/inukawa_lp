<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>いぬかわガチャ</title>


  <!-- LINE LIFF -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

      background: #000;
      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    }

    body {
      min-height: 100dvh;
    }

    button,
    a {
      font-family: inherit;
    }


    /* ========================================
       共通画面
       ======================================== */

    .screen {
      display: none;

      width: 100%;
      min-height: 100dvh;

      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .screen.active {
      display: flex;
    }


    /* ========================================
       案内画面
       ======================================== */

    #accessScreen {
      padding: 30px 20px;

      background:
        radial-gradient(
          circle at center,
          #222 0%,
          #080808 55%,
          #000 100%
        );
    }

    .access-inner {
      width: 100%;
      max-width: 500px;
    }

    #accessTitle {
      margin: 0 0 22px;

      font-size: 30px;
      line-height: 1.4;
      font-weight: 900;
    }

    #accessMessage {
      margin: 0 0 32px;

      font-size: 17px;
      line-height: 1.9;
    }

    #accessButton {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: 90%;
      max-width: 360px;
      min-height: 60px;

      padding: 10px 20px;

      border-radius: 999px;

      background: #fff;
      color: #111;

      text-decoration: none;

      font-size: 17px;
      font-weight: 900;
    }


    /* ========================================
       ガチャ開始
       ======================================== */

    #startScreen {
      padding: 30px 20px;

      background:
        radial-gradient(
          circle at center,
          #222 0%,
          #080808 55%,
          #000 100%
        );
    }

    .start-inner {
      width: 100%;
      max-width: 500px;
    }

    .title {
      margin: 0 0 18px;

      font-size: 38px;
      font-weight: 900;
    }

    .message {
      margin: 0 0 35px;

      font-size: 17px;
      line-height: 1.8;
    }

    #drawButton {
      width: 90%;
      max-width: 360px;
      min-height: 72px;

      border: none;
      border-radius: 999px;

      background: #fff;
      color: #111;

      font-size: 23px;
      font-weight: 900;

      cursor: pointer;
    }

    #drawButton:active {
      transform: scale(.97);
    }

    #drawButton:disabled {
      opacity: .6;
      cursor: not-allowed;
    }


    /* ========================================
       動画
       ======================================== */

    #movieScreen {
      padding: 0;

      background: #000;

      overflow: hidden;
    }

    #gachaMovie {
      display: block;

      width: 100vw;
      height: 100dvh;

      object-fit: contain;

      background: #000;
    }


    /* ========================================
       結果画面
       ======================================== */

    #resultScreen {
      padding:
        max(25px, env(safe-area-inset-top))
        18px
        max(30px, env(safe-area-inset-bottom));

      background:
        radial-gradient(
          circle at 50% 25%,
          #283040 0%,
          #0c1017 50%,
          #050607 100%
        );
    }

    .result-inner {
      width: 100%;
      max-width: 560px;
    }

    #rank {
      margin-bottom: 20px;

      font-size: 46px;
      font-weight: 900;

      letter-spacing: .05em;
    }

    #alreadyText {
      display: none;

      margin: 0 0 18px;

      color: #ffe28a;

      font-size: 14px;
      font-weight: 800;
    }

    #prizeBox {
      width: 100%;

      transition:
        filter .4s ease,
        opacity .4s ease;
    }

    #prizeImage {
      display: block;

      width: 100%;
      max-height: 58dvh;

      margin: 0 auto;

      object-fit: contain;
    }


    /* ========================================
       景品引換
       ======================================== */

    #staffText {
      margin: 22px 0 10px;

      font-size: 13px;
      font-weight: 700;

      color: #ffe28a;
    }

    #redeemButton {
      width: 90%;
      max-width: 380px;
      min-height: 62px;

      border: none;
      border-radius: 12px;

      background: #fff;
      color: #111;

      font-size: 17px;
      font-weight: 900;

      cursor: pointer;
    }

    #redeemButton:disabled {
      opacity: .55;
      cursor: not-allowed;
    }


    /* ========================================
       引換後
       ======================================== */

    #prizeBox.redeemed {
      filter: grayscale(100%);
      opacity: .35;
    }

    #redeemedText {
      display: none;

      margin-top: 22px;

      font-size: 22px;
      font-weight: 900;
    }

    #thanks {
      display: none;

      margin-top: 24px;

      font-size: 26px;
      line-height: 1.5;
      font-weight: 900;
    }

    #topButton {
      display: none;

      align-items: center;
      justify-content: center;

      width: 90%;
      max-width: 360px;
      min-height: 58px;

      margin: 30px auto 0;

      padding: 10px 20px;

      border: 2px solid #fff;
      border-radius: 999px;

      background: transparent;
      color: #fff;

      text-decoration: none;

      font-size: 17px;
      font-weight: 900;
    }

    .finished #staffText,
    .finished #redeemButton {
      display: none;
    }

    .finished #redeemedText,
    .finished #thanks {
      display: block;
    }

    .finished #topButton {
      display: inline-flex;
    }

  </style>

</head>


<body>


  <!-- ========================================
       案内画面
       ======================================== -->

  <section
    id="accessScreen"
    class="screen active"
  >

    <div class="access-inner">

      <h1 id="accessTitle">
        確認しています
      </h1>

      <p id="accessMessage">
        LINE認証と参加状況を<br>
        確認しています。
      </p>

      <a
        id="accessButton"
        href="index.html"
        style="display:none;"
      >
        トップページへ戻る
      </a>

    </div>

  </section>



  <!-- ========================================
       ガチャ開始
       ======================================== -->

  <section
    id="startScreen"
    class="screen"
  >

    <div class="start-inner">

      <h1 class="title">
        いぬかわガチャ
      </h1>

      <p class="message">
        アンケートへのご回答<br>
        ありがとうございます。
      </p>

      <button
        id="drawButton"
        type="button"
      >
        ガチャを引く
      </button>

    </div>

  </section>



  <!-- ========================================
       動画
       ======================================== -->

  <section
    id="movieScreen"
    class="screen"
  >

    <video
      id="gachaMovie"
      playsinline
      preload="auto"
      disablepictureinpicture
    ></video>

  </section>



  <!-- ========================================
       結果
       ======================================== -->

  <section
    id="resultScreen"
    class="screen"
  >

    <div
      id="resultInner"
      class="result-inner"
    >

      <div id="rank"></div>

      <div id="alreadyText">
        このLINEアカウントは抽選済みです
      </div>

      <div id="prizeBox">

        <img
          id="prizeImage"
          src=""
          alt="景品"
        >

      </div>


      <p id="staffText">
        ※引き換えボタンはスタッフが押してください
      </p>


      <button
        id="redeemButton"
        type="button"
      >
        景品を引き換える
      </button>


      <div id="redeemedText">
        引き換え済み
      </div>


      <div id="thanks">
        ご協力ありがとうございました。
      </div>


      <a
        id="topButton"
        href="index.html"
      >
        トップページへ戻る
      </a>

    </div>

  </section>



  <script>

    /* ==================================================
       設定
       ================================================== */


    /*
      false = 本番
              9/20・9/21の指定時間のみ

      true  = テスト
              HTML側の時間制限だけ解除

      ★trueでも1人1回制限は解除されない

      ★Apps Script側の
       SERVER_DEMO_MODE
       と同じ設定にすること
    */

    const DEMO_MODE = true;



    /* ==================================================
       本番時間
       ================================================== */

    const GACHA_WINDOWS = [

      {
        start:
          new Date(
            "2026-09-20T13:00:00+09:00"
          ),

        end:
          new Date(
            "2026-09-20T17:30:00+09:00"
          ),

        label:
          "9月20日（日）13:00〜17:30"
      },

      {
        start:
          new Date(
            "2026-09-21T10:00:00+09:00"
          ),

        end:
          new Date(
            "2026-09-21T17:30:00+09:00"
          ),

        label:
          "9月21日（月・祝）10:00〜17:30"
      }

    ];



    /* ==================================================
       Apps Script
       ================================================== */

    const GACHA_API_URL =
      "https://script.google.com/macros/s/AKfycbxo5-G2MnqJh91QPobD1MnM3ueK6yp1dBwGD71w1lxFNS2b0n3A6xDLiD37Iyu9HowLIw/exec";



    /* ==================================================
       LINE LIFF
       ================================================== */

    const LIFF_ID =
      "2011366916-HlklylXX";


    let lineIdToken = "";



    /* ==================================================
       景品設定
       ================================================== */

    const prizes = {

      first: {

        rank:
          "1等",

        image:
          "1.png",

        movie:
          "inkg2.mp4"

      },


      second: {

        rank:
          "2等",

        image:
          "2.png",

        movie:
          "inkg2.mp4"

      },


      third: {

        rank:
          "3等",

        image:
          "3.png",

        movie:
          "inkg2.mp4"

      },


      participation: {

        rank:
          "参加賞",

        image:
          "4.png",

        movie:
          "inkg1.mp4"

      }

    };



    /* ==================================================
       要素
       ================================================== */

    const accessScreen =
      document.getElementById(
        "accessScreen"
      );

    const startScreen =
      document.getElementById(
        "startScreen"
      );

    const movieScreen =
      document.getElementById(
        "movieScreen"
      );

    const resultScreen =
      document.getElementById(
        "resultScreen"
      );


    const accessTitle =
      document.getElementById(
        "accessTitle"
      );

    const accessMessage =
      document.getElementById(
        "accessMessage"
      );

    const accessButton =
      document.getElementById(
        "accessButton"
      );


    const drawButton =
      document.getElementById(
        "drawButton"
      );

    const movie =
      document.getElementById(
        "gachaMovie"
      );

    const rank =
      document.getElementById(
        "rank"
      );

    const alreadyText =
      document.getElementById(
        "alreadyText"
      );

    const prizeImage =
      document.getElementById(
        "prizeImage"
      );

    const prizeBox =
      document.getElementById(
        "prizeBox"
      );

    const redeemButton =
      document.getElementById(
        "redeemButton"
      );

    const resultInner =
      document.getElementById(
        "resultInner"
      );


    let currentResult =
      null;

    let currentDrawId =
      null;



    /* ==================================================
       画面切替
       ================================================== */

    function showOnlyScreen(
      target
    ) {

      [
        accessScreen,
        startScreen,
        movieScreen,
        resultScreen
      ].forEach(
        screen => {
          screen.classList.remove(
            "active"
          );
        }
      );


      target.classList.add(
        "active"
      );

    }



    /* ==================================================
       案内画面
       ================================================== */

    function showAccessMessage(
      title,
      message,
      buttonText,
      href,
      showButton = true
    ) {

      accessTitle.textContent =
        title;


      accessMessage.innerHTML =
        message;


      if (showButton) {

        accessButton.style.display =
          "inline-flex";

        accessButton.textContent =
          buttonText;

        accessButton.href =
          href;

      } else {

        accessButton.style.display =
          "none";

      }


      showOnlyScreen(
        accessScreen
      );

    }



    /* ==================================================
       HTML側時間判定
       ================================================== */

    function getLocalGachaStatus() {

      if (
        DEMO_MODE === true
      ) {

        return {
          status: "open",
          nextLabel: ""
        };

      }


      const now =
        new Date();


      for (
        const item
        of GACHA_WINDOWS
      ) {

        if (
          now >= item.start &&
          now < item.end
        ) {

          return {
            status: "open",
            nextLabel: item.label
          };

        }

      }


      const nextWindow =
        GACHA_WINDOWS.find(
          item =>
            now < item.start
        );


      if (
        nextWindow
      ) {

        return {
          status: "before",
          nextLabel:
            nextWindow.label
        };

      }


      return {
        status: "after",
        nextLabel: ""
      };

    }



    /* ==================================================
       JSONP通信
       ================================================== */

    function requestApi(
      action,
      params = {}
    ) {

      return new Promise(
        (
          resolve,
          reject
        ) => {


          const callbackName =

            "inukawaGachaCallback_" +

            Date.now() +

            "_" +

            Math
              .random()
              .toString(36)
              .slice(2);


          const script =
            document.createElement(
              "script"
            );


          let finished =
            false;


          const timer =
            setTimeout(
              () => {

                cleanup();

                reject(
                  new Error(
                    "通信タイムアウト"
                  )
                );

              },

              10000

            );


          function cleanup() {

            if (
              finished
            ) {
              return;
            }


            finished =
              true;


            clearTimeout(
              timer
            );


            try {

              delete window[
                callbackName
              ];

            } catch (
              error
            ) {

              window[
                callbackName
              ] =
                undefined;

            }


            if (
              script.parentNode
            ) {

              script
                .parentNode
                .removeChild(
                  script
                );

            }

          }


          window[
            callbackName
          ] =
            function (
              data
            ) {

              cleanup();

              resolve(
                data
              );

            };


          script.onerror =
            function () {

              cleanup();

              reject(
                new Error(
                  "通信エラー"
                )
              );

            };


          let url =

            GACHA_API_URL +

            "?action=" +

            encodeURIComponent(
              action
            ) +

            "&callback=" +

            encodeURIComponent(
              callbackName
            ) +

            "&_=" +

            Date.now();


          Object
            .keys(
              params
            )
            .forEach(
              key => {

                url +=

                  "&" +

                  encodeURIComponent(
                    key
                  ) +

                  "=" +

                  encodeURIComponent(
                    params[key]
                  );

              }
            );


          script.src =
            url;


          document
            .head
            .appendChild(
              script
            );

        }
      );

    }



    /* ==================================================
       LINE認証
       ================================================== */

    async function initLineAuth() {


      if (
        typeof liff ===
        "undefined"
      ) {

        throw new Error(
          "LINE認証を読み込めませんでした"
        );

      }


      await liff.init({

        liffId:
          LIFF_ID

      });


     if (
  !liff.isLoggedIn()
) {

  window.location.replace(
    "https://liff.line.me/2011366916-HlklylXX/gacha.html"
  );

  return false;

}

      const token =
        liff.getIDToken();


      if (
        !token
      ) {

        throw new Error(
          "LINE認証情報を取得できませんでした"
        );

      }


      lineIdToken =
        token;


      return true;

    }



    /* ==================================================
       サーバー利用状況
       ================================================== */

    async function getUserStatus() {


      const data =
        await requestApi(

          "surveyStatus",

          {

            idToken:
              lineIdToken

          }

        );


      if (
        !data ||
        !data.success
      ) {

        throw new Error(

          data &&
          data.message

            ? data.message

            : "参加状況を確認できませんでした"

        );

      }


      return data;

    }



    /* ==================================================
       結果表示
       ================================================== */

    function showPrizeResult(
      result,
      drawId,
      options = {}
    ) {


      if (
        !prizes[result]
      ) {

        throw new Error(
          "景品データがありません"
        );

      }


      currentResult =
        result;


      currentDrawId =
        drawId;


      const prize =
        prizes[result];


      rank.textContent =
        prize.rank;


      prizeImage.src =
        prize.image;


      prizeBox.classList.remove(
        "redeemed"
      );


      resultInner.classList.remove(
        "finished"
      );


      alreadyText.style.display =
        options.alreadyDrawn
          ? "block"
          : "none";


      redeemButton.disabled =
        false;


      redeemButton.textContent =
        "景品を引き換える";


      /*
        すでに引換済み
      */

      if (
        options.redeemed ===
        true
      ) {

        prizeBox.classList.add(
          "redeemed"
        );


        resultInner.classList.add(
          "finished"
        );

      }


      showOnlyScreen(
        resultScreen
      );

    }



    /* ==================================================
       初期起動
       ================================================== */

    async function initializeGacha() {


      /*
        HTML側時間確認
      */

      const localStatus =
        getLocalGachaStatus();


      if (
        localStatus.status ===
        "before"
      ) {

        showAccessMessage(

          "まだ受付開始前です",

          "次回のアンケートガチャ受付時間は<br><br>" +

          "<strong>" +

          localStatus.nextLabel +

          "</strong><br><br>" +

          "です。",

          "トップページへ戻る",

          "index.html",

          true

        );


        return;

      }


      if (
        localStatus.status ===
        "after"
      ) {

        showAccessMessage(

          "受付は終了しました",

          "アンケートガチャの受付は終了しました。<br><br>" +

          "ご参加ありがとうございました。",

          "トップページへ戻る",

          "index.html",

          true

        );


        return;

      }



      try {


        showAccessMessage(

          "確認しています",

          "LINE認証と参加状況を<br>" +
          "確認しています。",

          "",

          "",

          false

        );


        /*
          LINE認証
        */

        const authReady =
          await initLineAuth();


        if (
          !authReady
        ) {

          return;

        }



        /*
          サーバー確認
        */

        const userStatus =
          await getUserStatus();



        /*
          アンケート未回答
        */

        if (
          userStatus.answered !==
          true
        ) {

          showAccessMessage(

            "アンケート回答が必要です",

            "ガチャはアンケートに<br>" +
            "ご回答いただいた方のみ<br>" +
            "ご利用いただけます。",

            "アンケートへ進む",

            "survey.html",

            true

          );


          return;

        }



        /*
          すでに抽選済み
        */

        if (
          userStatus.drawn ===
          true
        ) {

          showPrizeResult(

            userStatus.result,

            userStatus.drawId,

            {

              alreadyDrawn:
                true,

              redeemed:
                userStatus.redeemed ===
                true

            }

          );


          return;

        }



        /*
          アンケート回答済み
          ガチャ未実施
        */

        showOnlyScreen(
          startScreen
        );


      } catch (
        error
      ) {


        console.error(
          error
        );


        showAccessMessage(

          "確認できませんでした",

          (
            error &&
            error.message

              ? error.message

              : "通信エラーが発生しました。"
          ) +

          "<br><br>LINEからもう一度お試しください。",

          "トップページへ戻る",

          "index.html",

          true

        );

      }

    }



    /* ==================================================
       ガチャを引く
       ================================================== */

    drawButton.addEventListener(
      "click",
      async function () {


        const localStatus =
          getLocalGachaStatus();


        if (
          localStatus.status !==
          "open"
        ) {

          showAccessMessage(

            "現在は受付時間外です",

            "現在ガチャをご利用いただけません。",

            "トップページへ戻る",

            "index.html",

            true

          );


          return;

        }



        if (
          !lineIdToken
        ) {

          alert(
            "LINE認証が確認できません。\nLINEからもう一度開いてください。"
          );

          return;

        }



        drawButton.disabled =
          true;


        drawButton.textContent =
          "抽選中…";


        try {


          /*
            サーバー側でも
            アンケート回答・1人1回・時間
            を確認して抽選
          */

          const data =
            await requestApi(

              "draw",

              {

                idToken:
                  lineIdToken

              }

            );


          if (
            !data ||
            !data.success
          ) {

            throw new Error(

              data &&
              data.message

                ? data.message

                : "抽選できませんでした"

            );

          }



          /*
            すでに抽選済みだった場合

            新しい抽選は行わず
            前回結果を表示
          */

          if (
            data.alreadyDrawn ===
            true
          ) {

            showPrizeResult(

              data.result,

              data.drawId,

              {

                alreadyDrawn:
                  true,

                redeemed:
                  false

              }

            );


            return;

          }



          currentResult =
            data.result;


          currentDrawId =
            data.drawId;


          if (
            !prizes[
              currentResult
            ]
          ) {

            throw new Error(
              "景品データがありません"
            );

          }


          if (
            !currentDrawId
          ) {

            throw new Error(
              "抽選IDがありません"
            );

          }



          /*
            動画
          */

          const prize =
            prizes[
              currentResult
            ];


          movie.src =
            prize.movie;


          movie.currentTime =
            0;


          showOnlyScreen(
            movieScreen
          );


          let resultShown =
            false;



          function showResult() {


            if (
              resultShown
            ) {

              return;

            }


            resultShown =
              true;


            showPrizeResult(

              currentResult,

              currentDrawId,

              {

                alreadyDrawn:
                  false,

                redeemed:
                  false

              }

            );

          }



          movie.onended =
            showResult;


          movie.onerror =
            showResult;


          const playPromise =
            movie.play();


          if (
            playPromise &&
            typeof playPromise.catch ===
            "function"
          ) {

            playPromise.catch(
              function () {

                showResult();

              }
            );

          }


        } catch (
          error
        ) {


          console.error(
            error
          );


          alert(

            error &&
            error.message

              ? error.message

              : "抽選中にエラーが発生しました。"

          );


          drawButton.disabled =
            false;


          drawButton.textContent =
            "ガチャを引く";

        }

      }
    );



    /* ==================================================
       景品引換
       ================================================== */

    redeemButton.addEventListener(
      "click",
      async function () {


        if (
          !currentDrawId
        ) {

          alert(
            "抽選IDがありません。"
          );

          return;

        }


        const confirmed =
          confirm(

            "景品を引き換え済みにしますか？\n\n" +

            "※この操作はスタッフが行ってください。"

          );


        if (
          !confirmed
        ) {

          return;

        }


        redeemButton.disabled =
          true;


        redeemButton.textContent =
          "処理中…";


        try {


          const data =
            await requestApi(

              "redeem",

              {

                drawId:
                  currentDrawId

              }

            );


          if (
            !data ||
            !data.success
          ) {

            throw new Error(

              data &&
              data.message

                ? data.message

                : "引き換え処理に失敗しました"

            );

          }



          /*
            グレーアウト
          */

          prizeBox.classList.add(
            "redeemed"
          );


          resultInner.classList.add(
            "finished"
          );


        } catch (
          error
        ) {


          console.error(
            error
          );


          alert(

            error &&
            error.message

              ? error.message

              : "引き換え処理中にエラーが発生しました。"

          );


          redeemButton.disabled =
            false;


          redeemButton.textContent =
            "景品を引き換える";

        }

      }
    );



    /* ==================================================
       起動
       ================================================== */

    initializeGacha();

  </script>

</body>

</html>
