<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>いぬかわガチャ</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    }

    body {
      min-height: 100dvh;
    }

    button {
      font-family: inherit;
    }

    .screen {
      display: none;
      width: 100%;
      min-height: 100dvh;

      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .screen.active {
      display: flex;
    }


    /* =========================
       ガチャ開始
       ========================= */

    #startScreen {
      padding: 30px 20px;

      background:
        radial-gradient(
          circle at center,
          #222 0%,
          #080808 55%,
          #000 100%
        );
    }

    .start-inner {
      width: 100%;
      max-width: 500px;
    }

    .title {
      margin: 0 0 18px;

      font-size: 38px;
      font-weight: 900;
    }

    .message {
      margin: 0 0 35px;

      font-size: 17px;
      line-height: 1.8;
    }

    #drawButton {
      width: 90%;
      max-width: 360px;
      min-height: 72px;

      border: none;
      border-radius: 999px;

      background: #fff;
      color: #111;

      font-size: 23px;
      font-weight: 900;

      cursor: pointer;
    }

    #drawButton:active {
      transform: scale(0.97);
    }

    #drawButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }


    /* =========================
       動画
       ========================= */

    #movieScreen {
      padding: 0;

      background: #000;

      overflow: hidden;
    }

    #gachaMovie {
      display: block;

      width: 100vw;
      height: 100dvh;

      object-fit: contain;

      background: #000;
    }


    /* =========================
       結果
       ========================= */

    #resultScreen {
      padding:
        max(25px, env(safe-area-inset-top))
        18px
        max(30px, env(safe-area-inset-bottom));

      background:
        radial-gradient(
          circle at 50% 25%,
          #283040 0%,
          #0c1017 50%,
          #050607 100%
        );
    }

    .result-inner {
      width: 100%;
      max-width: 560px;
    }

    #rank {
      margin-bottom: 20px;

      font-size: 46px;
      font-weight: 1000;

      letter-spacing: 0.05em;
    }

    #prizeBox {
      width: 100%;

      transition:
        filter 0.4s ease,
        opacity 0.4s ease;
    }

    #prizeImage {
      display: block;

      width: 100%;
      max-height: 58dvh;

      margin: 0 auto;

      object-fit: contain;
    }


    /* =========================
       スタッフ引き換え
       ========================= */

    #staffText {
      margin: 22px 0 10px;

      font-size: 13px;
      font-weight: 700;

      color: #ffe28a;
    }

    #redeemButton {
      width: 90%;
      max-width: 380px;
      min-height: 62px;

      border: none;
      border-radius: 12px;

      background: #fff;
      color: #111;

      font-size: 17px;
      font-weight: 900;

      cursor: pointer;
    }

    #redeemButton:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }


    /* =========================
       引き換え後
       ========================= */

    #prizeBox.redeemed {
      filter: grayscale(100%);
      opacity: 0.35;
    }

    #redeemedText {
      display: none;

      margin-top: 22px;

      font-size: 22px;
      font-weight: 900;
    }

    #thanks {
      display: none;

      margin-top: 24px;

      font-size: 26px;
      line-height: 1.5;
      font-weight: 900;
    }

    #topButton {
      display: none;

      width: 90%;
      max-width: 360px;
      min-height: 58px;

      margin: 30px auto 0;

      border: 2px solid #fff;
      border-radius: 999px;

      background: transparent;
      color: #fff;

      font-size: 17px;
      font-weight: 900;

      cursor: pointer;
    }

    .finished #staffText,
    .finished #redeemButton {
      display: none;
    }

    .finished #redeemedText,
    .finished #thanks,
    .finished #topButton {
      display: block;
    }

  </style>
</head>


<body>


  <!-- =========================
       1 ガチャ開始
       ========================= -->

  <section
    id="startScreen"
    class="screen active"
  >

    <div class="start-inner">

      <h1 class="title">
        いぬかわガチャ
      </h1>

      <p class="message">
        アンケートへのご回答<br>
        ありがとうございます。
      </p>

      <button
        id="drawButton"
        type="button"
      >
        ガチャを引く
      </button>

    </div>

  </section>



  <!-- =========================
       2 動画
       ========================= -->

  <section
    id="movieScreen"
    class="screen"
  >

    <video
      id="gachaMovie"
      playsinline
      preload="auto"
      disablepictureinpicture
    ></video>

  </section>



  <!-- =========================
       3 結果
       ========================= -->

  <section
    id="resultScreen"
    class="screen"
  >

    <div
      id="resultInner"
      class="result-inner"
    >

      <div id="rank"></div>


      <div id="prizeBox">

        <img
          id="prizeImage"
          src=""
          alt="景品"
        >

      </div>


      <p id="staffText">
        ※引き換えボタンはスタッフが押してください
      </p>


      <button
        id="redeemButton"
        type="button"
      >
        景品を引き換える
      </button>


      <div id="redeemedText">
        引き換え済み
      </div>


      <div id="thanks">
        ご協力ありがとうございました。
      </div>


      <button
        id="topButton"
        type="button"
      >
        トップページへ戻る
      </button>

    </div>

  </section>



  <script>

    (function () {


      /* ==================================================
         DEMO MODE

         false
         ↓
         明日10:00〜10:30だけ利用可能

         true
         ↓
         時間制限だけ解除

         ※アンケート回答済みチェックは
           DEMO MODEでも残ります
         ================================================== */

      const DEMO_MODE = false;


      /* ==================================================
         明日のガチャ利用時間

         2026年9月9日
         10:00 開始
         10:30 終了

         日本時間
         ================================================== */

      const GACHA_START =
        new Date("2026-09-09T10:00:00+09:00");

      const GACHA_END =
        new Date("2026-09-09T10:30:00+09:00");


      /* ==================================================
         Apps Script
         ================================================== */

      const GACHA_API_URL =
        "https://script.google.com/macros/s/AKfycbxo5-G2MnqJh91QPobD1MnM3ueK6yp1dBwGD71w1lxFNS2b0n3A6xDLiD37Iyu9HowLIw/exec";


      /* ==================================================
         景品
         ================================================== */

      const prizes = {

        first: {
          rank: "1等",
          image: "1.png",
          movie: "inkg2.mp4"
        },

        second: {
          rank: "2等",
          image: "2.png",
          movie: "inkg2.mp4"
        },

        third: {
          rank: "3等",
          image: "3.png",
          movie: "inkg2.mp4"
        },

        participation: {
          rank: "参加賞",
          image: "4.png",
          movie: "inkg1.mp4"
        }

      };


      /* ==================================================
         ガチャ時間判定
         ================================================== */

      function getGachaStatus() {

        if (DEMO_MODE) {
          return "open";
        }

        const now =
          new Date();


        /* 10:00前 */

        if (now < GACHA_START) {
          return "before";
        }


        /* 10:00〜10:29:59 */

        if (
          now >= GACHA_START &&
          now < GACHA_END
        ) {
          return "open";
        }


        /* 10:30以降 */

        return "after";

      }


      /* ==================================================
         アンケート回答済み確認
         ================================================== */

      function hasSurveyCompleted() {

        return (
          sessionStorage.getItem(
            "inukawaSurveyCompleted"
          ) === "true"
        );

      }


      /* ==================================================
         ページを開いた時の不正アクセス確認
         ================================================== */

      function checkGachaAccess() {

        const gachaStatus =
          getGachaStatus();


        /* =========================
           開始前
           ========================= */

        if (gachaStatus === "before") {

          alert(
            "ガチャはまだ利用開始前です。\n\n" +
            "明日のテスト時間\n" +
            "10:00〜10:30"
          );

          location.replace(
            "index.html"
          );

          return false;
        }


        /* =========================
           終了後
           ========================= */

        if (gachaStatus === "after") {

          alert(
            "本日のアンケートガチャ受付は終了しました。"
          );

          location.replace(
            "index.html"
          );

          return false;
        }


        /* =========================
           アンケート未回答
           ========================= */

        if (!hasSurveyCompleted()) {

          alert(
            "アンケート回答後にガチャへ進んでください。"
          );

          location.replace(
            "survey.html"
          );

          return false;
        }


        return true;

      }


      /* ==================================================
         ページを開いた時点で確認
         ================================================== */

      if (!checkGachaAccess()) {
        return;
      }


      /* ==================================================
         要素
         ================================================== */

      const startScreen =
        document.getElementById(
          "startScreen"
        );

      const movieScreen =
        document.getElementById(
          "movieScreen"
        );

      const resultScreen =
        document.getElementById(
          "resultScreen"
        );

      const drawButton =
        document.getElementById(
          "drawButton"
        );

      const movie =
        document.getElementById(
          "gachaMovie"
        );

      const rank =
        document.getElementById(
          "rank"
        );

      const prizeImage =
        document.getElementById(
          "prizeImage"
        );

      const prizeBox =
        document.getElementById(
          "prizeBox"
        );

      const redeemButton =
        document.getElementById(
          "redeemButton"
        );

      const topButton =
        document.getElementById(
          "topButton"
        );

      const resultInner =
        document.getElementById(
          "resultInner"
        );


      let currentResult =
        null;

      let currentDrawId =
        null;


      /* ==================================================
         画面切替
         ================================================== */

      function showScreen(target) {

        startScreen.classList.remove(
          "active"
        );

        movieScreen.classList.remove(
          "active"
        );

        resultScreen.classList.remove(
          "active"
        );

        target.classList.add(
          "active"
        );

      }


      /* ==================================================
         Apps Script通信
         ================================================== */

      function requestApi(
        action,
        params
      ) {

        return new Promise(
          function (
            resolve,
            reject
          ) {

            const callbackName =
              "gachaCallback_" +
              Date.now() +
              "_" +
              Math.random()
                .toString(36)
                .slice(2);


            const script =
              document.createElement(
                "script"
              );


            const timer =
              setTimeout(
                function () {

                  cleanup();

                  reject(
                    new Error(
                      "通信タイムアウト"
                    )
                  );

                },
                10000
              );


            function cleanup() {

              clearTimeout(
                timer
              );

              delete window[
                callbackName
              ];

              if (
                script.parentNode
              ) {

                script.parentNode
                  .removeChild(
                    script
                  );

              }

            }


            window[
              callbackName
            ] =
              function (data) {

                cleanup();

                resolve(
                  data
                );

              };


            script.onerror =
              function () {

                cleanup();

                reject(
                  new Error(
                    "通信エラー"
                  )
                );

              };


            let url =
              GACHA_API_URL +
              "?action=" +
              encodeURIComponent(
                action
              ) +
              "&callback=" +
              encodeURIComponent(
                callbackName
              ) +
              "&_=" +
              Date.now();


            if (params) {

              Object.keys(
                params
              )
                .forEach(
                  function (key) {

                    url +=
                      "&" +
                      encodeURIComponent(
                        key
                      ) +
                      "=" +
                      encodeURIComponent(
                        params[key]
                      );

                  }
                );

            }


            script.src =
              url;


            document.head
              .appendChild(
                script
              );

          }
        );

      }


      /* ==================================================
         ガチャを引く
         ================================================== */

      drawButton.addEventListener(
        "click",
        async function () {


          /* =========================================
             抽選ボタンを押した瞬間に
             時間をもう一度確認
             ========================================= */

          const gachaStatus =
            getGachaStatus();


          if (
            gachaStatus !== "open"
          ) {

            drawButton.disabled =
              true;

            alert(
              "ガチャの受付時間が終了しました。"
            );

            location.replace(
              "index.html"
            );

            return;
          }


          /* =========================================
             アンケート通行証を再確認
             ========================================= */

          if (
            !hasSurveyCompleted()
          ) {

            alert(
              "アンケート回答後にガチャへ進んでください。"
            );

            location.replace(
              "survey.html"
            );

            return;
          }


          drawButton.disabled =
            true;

          drawButton.textContent =
            "抽選中…";


          try {

            const data =
              await requestApi(
                "draw"
              );


            if (
              !data ||
              !data.success
            ) {

              alert(
                data &&
                data.message
                  ? data.message
                  : "抽選できませんでした"
              );


              drawButton.disabled =
                false;

              drawButton.textContent =
                "ガチャを引く";

              return;
            }


            currentResult =
              data.result;


            currentDrawId =
              data.drawId;


            if (
              !prizes[
                currentResult
              ]
            ) {

              throw new Error(
                "景品データがありません"
              );

            }


            if (
              !currentDrawId
            ) {

              throw new Error(
                "抽選IDがありません"
              );

            }


            /* =========================================
               ガチャを引いた時点で
               アンケート通行証を消す

               ↓

               ページ更新して
               もう一度引くのを防止
               ========================================= */

            sessionStorage.removeItem(
              "inukawaSurveyCompleted"
            );

            sessionStorage.removeItem(
              "inukawaSurveyCompletedAt"
            );


            playMovie(
              currentResult
            );


          } catch (error) {

            console.error(
              error
            );


            alert(
              "通信に失敗しました。\nもう一度お試しください。"
            );


            drawButton.disabled =
              false;

            drawButton.textContent =
              "ガチャを引く";

          }

        }
      );


      /* ==================================================
         動画
         ================================================== */

      function playMovie(
        result
      ) {

        const prize =
          prizes[result];


        movie.pause();


        movie.src =
          prize.movie;


        movie.currentTime =
          0;


        showScreen(
          movieScreen
        );


        movie.play()
          .catch(
            function () {

              showResult(
                result
              );

            }
          );

      }


      /* ==================================================
         動画終了
         ================================================== */

      movie.addEventListener(
        "ended",
        function () {

          if (
            currentResult &&
            prizes[
              currentResult
            ]
          ) {

            showResult(
              currentResult
            );

          }

        }
      );


      /* ==================================================
         結果
         ================================================== */

      function showResult(
        result
      ) {

        const prize =
          prizes[result];


        rank.textContent =
          prize.rank;


        prizeImage.src =
          prize.image;


        showScreen(
          resultScreen
        );

      }


      /* ==================================================
         景品引き換え
         ================================================== */

      redeemButton.addEventListener(
        "click",
        async function () {


          const ok =
            confirm(
              "スタッフ確認\n\n景品を引き換え済みにしますか？"
            );


          if (!ok) {
            return;
          }


          if (
            !currentDrawId
          ) {

            alert(
              "抽選情報がありません。"
            );

            return;
          }


          redeemButton.disabled =
            true;

          redeemButton.textContent =
            "処理中…";


          try {

            const data =
              await requestApi(
                "redeem",
                {
                  drawId:
                    currentDrawId
                }
              );


            if (
              !data ||
              !data.success
            ) {

              alert(
                data &&
                data.message
                  ? data.message
                  : "引き換え処理に失敗しました"
              );


              redeemButton.disabled =
