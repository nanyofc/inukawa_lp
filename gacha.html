<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>いぬかわガチャ</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    }

    body {
      min-height: 100dvh;
    }

    button {
      font-family: inherit;
    }

    .screen {
      display: none;
      width: 100%;
      min-height: 100dvh;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .screen.active {
      display: flex;
    }


    /* =========================
       案内画面
       ========================= */

    #accessScreen {
      padding: 30px 20px;

      background:
        radial-gradient(
          circle at center,
          #222 0%,
          #080808 55%,
          #000 100%
        );
    }

    .access-inner {
      width: 100%;
      max-width: 500px;
    }

    #accessTitle {
      margin: 0 0 22px;
      font-size: 32px;
      line-height: 1.4;
      font-weight: 900;
    }

    #accessMessage {
      margin: 0 0 32px;
      font-size: 17px;
      line-height: 1.9;
    }

    #accessButton {
      width: 90%;
      max-width: 360px;
      min-height: 60px;

      border: none;
      border-radius: 999px;

      background: #fff;
      color: #111;

      font-size: 17px;
      font-weight: 900;

      cursor: pointer;
    }


    /* =========================
       ガチャ開始
       ========================= */

    #startScreen {
      padding: 30px 20px;

      background:
        radial-gradient(
          circle at center,
          #222 0%,
          #080808 55%,
          #000 100%
        );
    }

    .start-inner {
      width: 100%;
      max-width: 500px;
    }

    .title {
      margin: 0 0 18px;
      font-size: 38px;
      font-weight: 900;
    }

    .message {
      margin: 0 0 35px;
      font-size: 17px;
      line-height: 1.8;
    }

    #drawButton {
      width: 90%;
      max-width: 360px;
      min-height: 72px;

      border: none;
      border-radius: 999px;

      background: #fff;
      color: #111;

      font-size: 23px;
      font-weight: 900;

      cursor: pointer;
    }

    #drawButton:active {
      transform: scale(0.97);
    }

    #drawButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }


    /* =========================
       動画
       ========================= */

    #movieScreen {
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    #gachaMovie {
      display: block;
      width: 100vw;
      height: 100dvh;
      object-fit: contain;
      background: #000;
    }


    /* =========================
       結果
       ========================= */

    #resultScreen {
      padding:
        max(25px, env(safe-area-inset-top))
        18px
        max(30px, env(safe-area-inset-bottom));

      background:
        radial-gradient(
          circle at 50% 25%,
          #283040 0%,
          #0c1017 50%,
          #050607 100%
        );
    }

    .result-inner {
      width: 100%;
      max-width: 560px;
    }

    #rank {
      margin-bottom: 20px;
      font-size: 46px;
      font-weight: 1000;
      letter-spacing: 0.05em;
    }

    #prizeBox {
      width: 100%;

      transition:
        filter 0.4s ease,
        opacity 0.4s ease;
    }

    #prizeImage {
      display: block;
      width: 100%;
      max-height: 58dvh;
      margin: 0 auto;
      object-fit: contain;
    }


    /* =========================
       景品引換
       ========================= */

    #staffText {
      margin: 22px 0 10px;
      font-size: 13px;
      font-weight: 700;
      color: #ffe28a;
    }

    #redeemButton {
      width: 90%;
      max-width: 380px;
      min-height: 62px;

      border: none;
      border-radius: 12px;

      background: #fff;
      color: #111;

      font-size: 17px;
      font-weight: 900;

      cursor: pointer;
    }

    #redeemButton:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }


    /* =========================
       引換後
       ========================= */

    #prizeBox.redeemed {
      filter: grayscale(100%);
      opacity: 0.35;
    }

    #redeemedText {
      display: none;
      margin-top: 22px;
      font-size: 22px;
      font-weight: 900;
    }

    #thanks {
      display: none;
      margin-top: 24px;
      font-size: 26px;
      line-height: 1.5;
      font-weight: 900;
    }

    #topButton {
      display: none;

      width: 90%;
      max-width: 360px;
      min-height: 58px;

      margin: 30px auto 0;

      border: 2px solid #fff;
      border-radius: 999px;

      background: transparent;
      color: #fff;

      font-size: 17px;
      font-weight: 900;

      cursor: pointer;
    }

    .finished #staffText,
    .finished #redeemButton {
      display: none;
    }

    .finished #redeemedText,
    .finished #thanks,
    .finished #topButton {
      display: block;
    }

  </style>
</head>


<body>


  <!-- =========================
       案内画面
       ========================= -->

  <section
    id="accessScreen"
    class="screen active"
  >

    <div class="access-inner">

      <h1 id="accessTitle">
        確認中です
      </h1>

      <p id="accessMessage">
        ガチャの利用条件を確認しています。
      </p>

      <button
        id="accessButton"
        type="button"
      >
        トップページへ戻る
      </button>

    </div>

  </section>



  <!-- =========================
       ガチャ開始
       ========================= -->

  <section
    id="startScreen"
    class="screen"
  >

    <div class="start-inner">

      <h1 class="title">
        いぬかわガチャ
      </h1>

      <p class="message">
        アンケートへのご回答<br>
        ありがとうございます。
      </p>

      <button
        id="drawButton"
        type="button"
      >
        ガチャを引く
      </button>

    </div>

  </section>



  <!-- =========================
       動画
       ========================= -->

  <section
    id="movieScreen"
    class="screen"
  >

    <video
      id="gachaMovie"
      playsinline
      preload="auto"
      disablepictureinpicture
    ></video>

  </section>



  <!-- =========================
       結果
       ========================= -->

  <section
    id="resultScreen"
    class="screen"
  >

    <div
      id="resultInner"
      class="result-inner"
    >

      <div id="rank"></div>


      <div id="prizeBox">

        <img
          id="prizeImage"
          src=""
          alt="景品"
        >

      </div>


      <p id="staffText">
        ※引き換えボタンはスタッフが押してください
      </p>


      <button
        id="redeemButton"
        type="button"
      >
        景品を引き換える
      </button>


      <div id="redeemedText">
        引き換え済み
      </div>


      <div id="thanks">
        ご協力ありがとうございました。
      </div>


      <button
        id="topButton"
        type="button"
      >
        トップページへ戻る
      </button>

    </div>

  </section>



  <script>

    /* ==================================================
       DEMO MODE

       false
       → 9/9 10:00〜10:30のみ利用可能

       true
       → 時間制限だけ解除

       ※アンケート回答済みチェックは残る
       ================================================== */

    const DEMO_MODE = false;


    /* ==================================================
       テスト時間
       ================================================== */

    const GACHA_START =
      new Date(
        "2026-09-09T10:00:00+09:00"
      );

    const GACHA_END =
      new Date(
        "2026-09-09T10:30:00+09:00"
      );


    /* ==================================================
       Apps Script
       ================================================== */

    const GACHA_API_URL =
      "https://script.google.com/macros/s/AKfycbxo5-G2MnqJh91QPobD1MnM3ueK6yp1dBwGD71w1lxFNS2b0n3A6xDLiD37Iyu9HowLIw/exec";


    /* ==================================================
       景品
       ================================================== */

    const prizes = {

      first: {
        rank: "1等",
        image: "1.png",
        movie: "inkg2.mp4"
      },

      second: {
        rank: "2等",
        image: "2.png",
        movie: "inkg2.mp4"
      },

      third: {
        rank: "3等",
        image: "3.png",
        movie: "inkg2.mp4"
      },

      participation: {
        rank: "参加賞",
        image: "4.png",
        movie: "inkg1.mp4"
      }

    };


    /* ==================================================
       要素
       ================================================== */

    const accessScreen =
      document.getElementById(
        "accessScreen"
      );

    const startScreen =
      document.getElementById(
        "startScreen"
      );

    const movieScreen =
      document.getElementById(
        "movieScreen"
      );

    const resultScreen =
      document.getElementById(
        "resultScreen"
      );


    const accessTitle =
      document.getElementById(
        "accessTitle"
      );

    const accessMessage =
      document.getElementById(
        "accessMessage"
      );

    const accessButton =
      document.getElementById(
        "accessButton"
      );


    const drawButton =
      document.getElementById(
        "drawButton"
      );

    const movie =
      document.getElementById(
        "gachaMovie"
      );

    const rank =
      document.getElementById(
        "rank"
      );

    const prizeImage =
      document.getElementById(
        "prizeImage"
      );

    const prizeBox =
      document.getElementById(
        "prizeBox"
      );

    const redeemButton =
      document.getElementById(
        "redeemButton"
      );

    const topButton =
      document.getElementById(
        "topButton"
      );

    const resultInner =
      document.getElementById(
        "resultInner"
      );


    let currentResult =
      null;

    let currentDrawId =
      null;

    let accessDestination =
      "index.html";


    /* ==================================================
       画面切替
       ================================================== */

    function showScreen(
      target
    ) {

      accessScreen.classList.remove(
        "active"
      );

      startScreen.classList.remove(
        "active"
      );

      movieScreen.classList.remove(
        "active"
      );

      resultScreen.classList.remove(
        "active"
      );


      target.classList.add(
        "active"
      );

    }


    /* ==================================================
       案内画面
       ================================================== */

    function showAccess(
      title,
      message,
      buttonText,
      destination
    ) {

      accessTitle.textContent =
        title;

      accessMessage.innerHTML =
        message;

      accessButton.textContent =
        buttonText;

      accessDestination =
        destination;


      showScreen(
        accessScreen
      );

    }


    /* ==================================================
       案内ボタン
       ================================================== */

    accessButton.addEventListener(
      "click",
      function () {

        window.location.href =
          accessDestination;

      }
    );


    /* ==================================================
       時間判定
       ================================================== */

    function getGachaStatus() {

      if (DEMO_MODE) {
        return "open";
      }


      const now =
        new Date();


      if (
        now < GACHA_START
      ) {
        return "before";
      }


      if (
        now >= GACHA_START &&
        now < GACHA_END
      ) {
        return "open";
      }


      return "after";

    }


    /* ==================================================
       アンケート回答済みチェック
       ================================================== */

    function hasSurveyCompleted() {

      return (
        sessionStorage.getItem(
          "inukawaSurveyCompleted"
        ) === "true"
      );

    }


    /* ==================================================
       アクセスチェック
       ================================================== */

    function checkAccess() {

      const status =
        getGachaStatus();


      /* 開始前 */

      if (
        status === "before"
      ) {

        showAccess(

          "まだ受付開始前です",

          "明日のテスト受付時間は<br><br>" +
          "<strong>10:00〜10:30</strong><br><br>" +
          "です。",

          "トップページへ戻る",

          "index.html"

        );

        return false;
      }


      /* 終了後 */

      if (
        status === "after"
      ) {

        showAccess(

          "受付は終了しました",

          "本日のアンケートガチャ受付は<br>" +
          "終了しました。",

          "トップページへ戻る",

          "index.html"

        );

        return false;
      }


      /* アンケート未回答 */

      if (
        !hasSurveyCompleted()
      ) {

        showAccess(

          "アンケート回答が必要です",

          "ガチャはアンケートに<br>" +
          "ご回答いただいた方のみ<br>" +
          "ご利用いただけます。",

          "アンケートへ進む",

          "survey.html"

        );

        return false;
      }


      /* 正常 */

      showScreen(
        startScreen
      );

      return true;

    }


    /* ==================================================
       Apps Script通信
       ================================================== */

    function requestApi(
      action,
      params
    ) {

      params =
        params || {};


      return new Promise(
        function (
          resolve,
          reject
        ) {


          const callbackName =
            "gachaCallback_" +
            Date.now() +
            "_" +
            Math.random()
              .toString(36)
              .slice(2);


          const script =
            document.createElement(
              "script"
            );


          const timer =
            setTimeout(
              function () {

                cleanup();

                reject(
                  new Error(
                    "通信タイムアウト"
                  )
                );

              },
              10000
            );


          function cleanup() {

            clearTimeout(
              timer
            );


            try {

              delete window[
                callbackName
              ];

            } catch (error) {

              window[
                callbackName
              ] =
                undefined;

            }


            if (
              script.parentNode
            ) {

              script.parentNode
                .removeChild(
                  script
                );

            }

          }


          window[
            callbackName
          ] =
            function (data) {

              cleanup();

              resolve(
                data
              );

            };


          script.onerror =
            function () {

              cleanup();

              reject(
                new Error(
                  "通信エラー"
                )
              );

            };


          let url =
            GACHA_API_URL +
            "?action=" +
            encodeURIComponent(
              action
            ) +
            "&callback=" +
            encodeURIComponent(
              callbackName
            ) +
            "&_=" +
            Date.now();


          Object.keys(
            params
          )
            .forEach(
              function (key) {

                url +=
                  "&" +
                  encodeURIComponent(
                    key
                  ) +
                  "=" +
                  encodeURIComponent(
                    params[key]
                  );

              }
            );


          script.src =
            url;


          document.head
            .appendChild(
              script
            );

        }
      );

    }


    /* ==================================================
       ガチャ抽選
       ================================================== */

    drawButton.addEventListener(
      "click",
      async function () {


        /* 時間を再確認 */

        const status =
          getGachaStatus();


        if (
          status === "before"
        ) {

          showAccess(

            "まだ受付開始前です",

            "明日のテスト受付時間は<br><br>" +
            "<strong>10:00〜10:30</strong><br><br>" +
            "です。",

            "トップページへ戻る",

            "index.html"

          );

          return;
        }


        if (
          status === "after"
        ) {

          showAccess(

            "受付は終了しました",

            "本日のアンケートガチャ受付は<br>" +
            "終了しました。",

            "トップページへ戻る",

            "index.html"

          );

          return;
        }


        /* アンケート回答確認 */

        if (
          !hasSurveyCompleted()
        ) {

          showAccess(

            "アンケート回答が必要です",

            "ガチャはアンケートに<br>" +
            "ご回答いただいた方のみ<br>" +
            "ご利用いただけます。",

            "アンケートへ進む",

            "survey.html"

          );

          return;
        }


        drawButton.disabled =
          true;

        drawButton.textContent =
          "抽選中…";


        try {


          const data =
            await requestApi(
              "draw"
            );


          if (
            !data ||
            !data.success
          ) {

            alert(
              data &&
              data.message
                ? data.message
                : "抽選できませんでした"
            );


            drawButton.disabled =
              false;

            drawButton.textContent =
              "ガチャを引く";

            return;
          }


          currentResult =
            data.result;


          currentDrawId =
            data.drawId;


          if (
            !prizes[
              currentResult
            ]
          ) {

            throw new Error(
              "景品データがありません"
            );

          }


          if (
            !currentDrawId
          ) {

            throw new Error(
              "抽選IDがありません"
            );

          }


          /* 抽選成功したら通行証を削除 */

          sessionStorage.removeItem(
            "inukawaSurveyCompleted"
          );

          sessionStorage.removeItem(
            "inukawaSurveyCompletedAt"
          );


          playMovie(
            currentResult
          );


        } catch (error) {


          console.error(
            error
          );


          alert(
            "通信に失敗しました。\nもう一度お試しください。"
          );


          drawButton.disabled =
            false;

          drawButton.textContent =
            "ガチャを引く";

        }

      }
    );


    /* ==================================================
       動画
       ================================================== */

    function playMovie(
      result
    ) {

      const prize =
        prizes[
          result
        ];


      movie.pause();


      movie.src =
        prize.movie;


      movie.currentTime =
        0;


      showScreen(
        movieScreen
      );


      movie.play()
        .catch(
          function () {

            showResult(
              result
            );

          }
        );

    }


    /* ==================================================
       動画終了
       ================================================== */

    movie.addEventListener(
      "ended",
      function () {

        if (
          currentResult &&
          prizes[
            currentResult
          ]
        ) {

          showResult(
            currentResult
          );

        }

      }
    );


    /* ==================================================
       結果
       ================================================== */

    function showResult(
      result
    ) {

      const prize =
        prizes[
          result
        ];


      ra
