<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>いぬかわガチャ</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    }

    body {
      min-height: 100dvh;
    }

    button {
      font-family: inherit;
    }

    .screen {
      display: none;
      width: 100%;
      min-height: 100dvh;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .screen.active {
      display: flex;
    }


    /* =========================
       ガチャ開始画面
    ========================= */

    #startScreen {
      padding: 30px 20px;

      background:
        radial-gradient(
          circle at center,
          #222 0%,
          #080808 55%,
          #000 100%
        );
    }

    .start-inner {
      width: 100%;
      max-width: 500px;
    }

    .title {
      margin: 0 0 18px;
      font-size: 38px;
      font-weight: 900;
    }

    .message {
      margin: 0 0 35px;
      font-size: 17px;
      line-height: 1.8;
    }

    #drawButton {
      width: 90%;
      max-width: 360px;
      min-height: 72px;

      border: none;
      border-radius: 999px;

      background: #fff;
      color: #111;

      font-size: 23px;
      font-weight: 900;

      cursor: pointer;
    }

    #drawButton:active {
      transform: scale(0.97);
    }


    /* =========================
       ガチャ動画
    ========================= */

    #movieScreen {
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    #gachaMovie {
      display: block;

      width: 100vw;
      height: 100dvh;

      object-fit: contain;

      background: #000;
    }


    /* =========================
       結果画面
    ========================= */

    #resultScreen {
      padding:
        max(25px, env(safe-area-inset-top))
        18px
        max(30px, env(safe-area-inset-bottom));

      background:
        radial-gradient(
          circle at 50% 25%,
          #283040 0%,
          #0c1017 50%,
          #050607 100%
        );
    }

    .result-inner {
      width: 100%;
      max-width: 560px;
    }

    #rank {
      margin-bottom: 20px;

      font-size: 46px;
      font-weight: 1000;

      letter-spacing: 0.05em;
    }

    #prizeBox {
      width: 100%;

      transition:
        filter 0.4s ease,
        opacity 0.4s ease;
    }

    #prizeImage {
      display: block;

      width: 100%;
      max-height: 58dvh;

      margin: 0 auto;

      object-fit: contain;
    }


    /* =========================
       スタッフ引き換え
    ========================= */

    #staffText {
      margin: 22px 0 10px;

      font-size: 13px;
      font-weight: 700;

      color: #ffe28a;
    }

    #redeemButton {
      width: 90%;
      max-width: 380px;

      min-height: 62px;

      border: none;
      border-radius: 12px;

      background: #fff;
      color: #111;

      font-size: 17px;
      font-weight: 900;

      cursor: pointer;
    }


    /* =========================
       引き換え後
    ========================= */

    #prizeBox.redeemed {
      filter: grayscale(100%);
      opacity: 0.35;
    }

    #redeemedText {
      display: none;

      margin-top: 22px;

      font-size: 22px;
      font-weight: 900;
    }

    #thanks {
      display: none;

      margin-top: 24px;

      font-size: 26px;
      line-height: 1.5;
      font-weight: 900;
    }

    #topButton {
      display: none;

      width: 90%;
      max-width: 360px;

      min-height: 58px;

      margin: 30px auto 0;

      border: 2px solid #fff;
      border-radius: 999px;

      background: transparent;
      color: #fff;

      font-size: 17px;
      font-weight: 900;

      cursor: pointer;
    }

    .finished #staffText,
    .finished #redeemButton {
      display: none;
    }

    .finished #redeemedText,
    .finished #thanks,
    .finished #topButton {
      display: block;
    }

  </style>
</head>


<body>


<!-- =========================
     1. ガチャ開始
========================= -->

<section
  id="startScreen"
  class="screen active"
>

  <div class="start-inner">

    <h1 class="title">
      いぬかわガチャ
    </h1>

    <p class="message">
      アンケートへのご回答<br>
      ありがとうございます。
    </p>

    <button
      id="drawButton"
      type="button"
    >
      ガチャを引く
    </button>

  </div>

</section>



<!-- =========================
     2. ガチャ動画
========================= -->

<section
  id="movieScreen"
  class="screen"
>

  <video
    id="gachaMovie"
    playsinline
    preload="auto"
    disablepictureinpicture
  ></video>

</section>



<!-- =========================
     3. 結果画面
========================= -->

<section
  id="resultScreen"
  class="screen"
>

  <div
    id="resultInner"
    class="result-inner"
  >

    <div id="rank"></div>


    <div id="prizeBox">

      <img
        id="prizeImage"
        src=""
        alt="景品"
      >

    </div>


    <p id="staffText">
      ※引き換えボタンはスタッフが押してください
    </p>


    <button
      id="redeemButton"
      type="button"
    >
      景品を引き換える
    </button>


    <div id="redeemedText">
      引き換え済み
    </div>


    <div id="thanks">
      ご協力ありがとうございました。
    </div>


    <button
      id="topButton"
      type="button"
    >
      トップページへ戻る
    </button>


  </div>

</section>



<script>

(function () {


  /* =========================
     景品設定
  ========================= */

  const prizes = {

    first: {
      rank: "1等",
      image: "1.png",
      movie: "inkg2.mp4"
    },

    second: {
      rank: "2等",
      image: "2.png",
      movie: "inkg2.mp4"
    },

    third: {
      rank: "3等",
      image: "3.png",
      movie: "inkg2.mp4"
    },

    participation: {
      rank: "参加賞",
      image: "4.png",
      movie: "inkg1.mp4"
    }

  };


  /* =========================
     要素
  ========================= */

  const startScreen =
    document.getElementById(
      "startScreen"
    );

  const movieScreen =
    document.getElementById(
      "movieScreen"
    );

  const resultScreen =
    document.getElementById(
      "resultScreen"
    );


  const drawButton =
    document.getElementById(
      "drawButton"
    );

  const movie =
    document.getElementById(
      "gachaMovie"
    );

  const rank =
    document.getElementById(
      "rank"
    );

  const prizeImage =
    document.getElementById(
      "prizeImage"
    );

  const prizeBox =
    document.getElementById(
      "prizeBox"
    );

  const redeemButton =
    document.getElementById(
      "redeemButton"
    );

  const topButton =
    document.getElementById(
      "topButton"
    );

  const resultInner =
    document.getElementById(
      "resultInner"
    );


  let currentResult = null;


  /* =========================
     画面切替
  ========================= */

  function showScreen(target) {

    startScreen.classList.remove(
      "active"
    );

    movieScreen.classList.remove(
      "active"
    );

    resultScreen.classList.remove(
      "active"
    );

    target.classList.add(
      "active"
    );

  }


  /* =========================
     テスト抽選

     総数 1015

     1等 2
     2等 3
     3等 10
     参加賞 1000

     ※今は何回でもテスト可能
  ========================= */

  function testDraw() {

    const number =
      Math.floor(
        Math.random() * 1015
      );


    if (number < 2) {

      return "first";

    }


    if (number < 5) {

      return "second";

    }


    if (number < 15) {

      return "third";

    }


    return "participation";

  }


  /* =========================
     ガチャを引く
  ========================= */

  drawButton.addEventListener(
    "click",
    function () {

      drawButton.disabled = true;


      currentResult =
        testDraw();


      playMovie(
        currentResult
      );

    }
  );


  /* =========================
     動画再生
  ========================= */

  function playMovie(result) {

    const prize =
      prizes[result];


    movie.pause();


    movie.src =
      prize.movie;


    movie.currentTime =
      0;


    showScreen(
      movieScreen
    );


    movie.play()
      .catch(
        function () {

          showResult(
            result
          );

        }
      );

  }


  /* =========================
     動画終了
  ========================= */

  movie.addEventListener(
    "ended",
    function () {


      if (
        currentResult &&
        prizes[currentResult]
      ) {

        showResult(
          currentResult
        );

      }

    }
  );


  /* =========================
     景品表示
  ========================= */

  function showResult(result) {

    const prize =
      prizes[result];


    rank.textContent =
      prize.rank;


    prizeImage.src =
      prize.image;


    showScreen(
      resultScreen
    );

  }


  /* =========================
     スタッフ引き換え
  ========================= */

  redeemButton.addEventListener(
    "click",
    function () {


      const ok =
        confirm(
          "スタッフ確認\n\n景品を引き換え済みにしますか？"
        );


      if (!ok) {

        return;

      }


      setRedeemed();

    }
  );


  /* =========================
     引き換え済み
  ========================= */

  function setRedeemed() {

    prizeBox.classList.add(
      "redeemed"
    );


    resultInner.classList.add(
      "finished"
    );

  }


  /* =========================
     トップへ戻る
  ========================= */

  topButton.addEventListener(
    "click",
    function () {


      /*
        テスト仕様

        トップへ戻れば
        またアンケートから
        何回でもテスト可能
      */

      window.location.href =
        "index.html";

    }
  );


})();

</script>


</body>

</html>
