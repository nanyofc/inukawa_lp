<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>いぬかわガチャ</title>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

      background: #000;
      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    }

    body {
      min-height: 100dvh;
    }

    button,
    a {
      font-family: inherit;
    }


    /* ========================================
       共通画面
       ======================================== */

    .screen {
      display: none;

      width: 100%;
      min-height: 100dvh;

      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .screen.active {
      display: flex;
    }


    /* ========================================
       受付案内画面
       ======================================== */

    #accessScreen {

      padding: 30px 20px;

      background:
        radial-gradient(
          circle at center,
          #222 0%,
          #080808 55%,
          #000 100%
        );
    }

    .access-inner {
      width: 100%;
      max-width: 500px;
    }

    #accessTitle {

      margin: 0 0 22px;

      font-size: 32px;
      line-height: 1.4;
      font-weight: 900;
    }

    #accessMessage {

      margin: 0 0 32px;

      font-size: 17px;
      line-height: 1.9;
    }

    #accessButton {

      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: 90%;
      max-width: 360px;
      min-height: 60px;

      padding: 10px 20px;

      border-radius: 999px;

      background: #fff;
      color: #111;

      text-decoration: none;

      font-size: 17px;
      font-weight: 900;
    }


    /* ========================================
       ガチャ開始
       ======================================== */

    #startScreen {

      padding: 30px 20px;

      background:
        radial-gradient(
          circle at center,
          #222 0%,
          #080808 55%,
          #000 100%
        );
    }

    .start-inner {
      width: 100%;
      max-width: 500px;
    }

    .title {

      margin: 0 0 18px;

      font-size: 38px;
      font-weight: 900;
    }

    .message {

      margin: 0 0 35px;

      font-size: 17px;
      line-height: 1.8;
    }

    #drawButton {

      width: 90%;
      max-width: 360px;
      min-height: 72px;

      border: none;
      border-radius: 999px;

      background: #fff;
      color: #111;

      font-size: 23px;
      font-weight: 900;

      cursor: pointer;
    }

    #drawButton:active {
      transform: scale(0.97);
    }

    #drawButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }


    /* ========================================
       動画
       ======================================== */

    #movieScreen {

      padding: 0;

      background: #000;

      overflow: hidden;
    }

    #gachaMovie {

      display: block;

      width: 100vw;
      height: 100dvh;

      object-fit: contain;

      background: #000;
    }


    /* ========================================
       結果画面
       ======================================== */

    #resultScreen {

      padding:
        max(25px, env(safe-area-inset-top))
        18px
        max(30px, env(safe-area-inset-bottom));

      background:
        radial-gradient(
          circle at 50% 25%,
          #283040 0%,
          #0c1017 50%,
          #050607 100%
        );
    }

    .result-inner {
      width: 100%;
      max-width: 560px;
    }

    #rank {

      margin-bottom: 20px;

      font-size: 46px;
      font-weight: 900;

      letter-spacing: 0.05em;
    }

    #prizeBox {

      width: 100%;

      transition:
        filter 0.4s ease,
        opacity 0.4s ease;
    }

    #prizeImage {

      display: block;

      width: 100%;
      max-height: 58dvh;

      margin: 0 auto;

      object-fit: contain;
    }


    /* ========================================
       景品引換
       ======================================== */

    #staffText {

      margin: 22px 0 10px;

      font-size: 13px;
      font-weight: 700;

      color: #ffe28a;
    }

    #redeemButton {

      width: 90%;
      max-width: 380px;
      min-height: 62px;

      border: none;
      border-radius: 12px;

      background: #fff;
      color: #111;

      font-size: 17px;
      font-weight: 900;

      cursor: pointer;
    }

    #redeemButton:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }


    /* ========================================
       引換後
       ======================================== */

    #prizeBox.redeemed {

      filter: grayscale(100%);
      opacity: 0.35;
    }

    #redeemedText {

      display: none;

      margin-top: 22px;

      font-size: 22px;
      font-weight: 900;
    }

    #thanks {

      display: none;

      margin-top: 24px;

      font-size: 26px;
      line-height: 1.5;
      font-weight: 900;
    }

    #topButton {

      display: none;

      align-items: center;
      justify-content: center;

      width: 90%;
      max-width: 360px;
      min-height: 58px;

      margin: 30px auto 0;

      padding: 10px 20px;

      border: 2px solid #fff;
      border-radius: 999px;

      background: transparent;
      color: #fff;

      text-decoration: none;

      font-size: 17px;
      font-weight: 900;
    }

    .finished #staffText,
    .finished #redeemButton {
      display: none;
    }

    .finished #redeemedText,
    .finished #thanks {
      display: block;
    }

    .finished #topButton {
      display: inline-flex;
    }

  </style>

</head>


<body>


  <!-- ========================================
       受付案内

       JSが万一壊れても、
       この画面とTOPリンクは表示される
       ======================================== -->

  <section
    id="accessScreen"

    <div class="access-inner">

      <h1 id="accessTitle">

      <a

  <!-- ========================================

       ======================================== -->

  <section

    class="screen"
  >

    <div class="start-inner">

      <h1 class="title">

      <p class="message">

  <!-- ========================================

  <section

  >

    <div

      <div id="rank"></div>


      <div id="prizeBox">

      <p id="staffText">

      <button
        id="redeemButton"

      >

      </button>


      <div id="redeemedText">
        引き換え済み
      </div>


      <div id="thanks">
        ご協力ありがとうございました。
      </div>


      <a
        id="topButton"
        href="/inukawa_lp/index.html"
      >
        トップページへ戻る
      </a>

    </div>

  </section>



  <!-- ==================================================
       受付判定専用

       ガチャ本体とは別SCRIPTにしている
       ================================================== -->

  <script>

    /* =========================
       強制ON/OFF

       false
       → 明日の指定時間のみ

       true
       → 時間制限解除
       ========================= */

    const DEMO_MODE = false;


    /* =========================
       明日のテスト時間
       ========================= */

    const GACHA_START =
      new Date(
        "2026-09-09T10:00:00+09:00"
      );

    const GACHA_END =
      new Date(
        "2026-09-09T10:30:00+09:00"
      );


    /* =========================
       要素
       ========================= */

    const accessScreen =
      document.getElementById(
        "accessScreen"
      );

    const startScreen =
      document.getElementById(
        "startScreen"
      );

    const movieScreen =
      document.getElementById(
        "movieScreen"
      );

    const resultScreen =
      document.getElementById(
        "resultScreen"
      );

    const accessTitle =
      document.getElementById(
        "accessTitle"
      );

    const accessMessage =
      document.getElementById(
        "accessMessage"
      );

    const accessButton =
      document.getElementById(
        "accessButton"
      );


    /* =========================
       画面切替
       ========================= */

    function showOnlyScreen(
      target
    ) {

      accessScreen.classList.remove(
        "active"
      );

      startScreen.classList.remove(
        "active"
      );

      movieScreen.classList.remove(
        "active"
      );

      resultScreen.classList.remove(
        "active"
      );


      target.classList.add(
        "active"
      );

    }


    /* =========================
       案内表示
       ========================= */

    function showAccessMessage(
      title,
      message,
      buttonText,
      href
    ) {

      accessTitle.textContent =
        title;

      accessMessage.innerHTML =
        message;

      accessButton.textContent =
        buttonText;

      accessButton.href =
        href;


      showOnlyScreen(
        accessScreen
      );

    }


    /* =========================
       時間状態
       ========================= */

    function getGachaStatus() {

      if (
        DEMO_MODE === true
      ) {

        return "open";

      }


      const now =
        new Date();


      if (
        now < GACHA_START
      ) {

        return "before";

      }


      if (
        now >= GACHA_START &&
        now < GACHA_END
      ) {

        return "open";

      }


      return "after";

    }


    /* =========================
       アンケート回答済み
       ========================= */

    function hasSurveyCompleted() {

      return (
        sessionStorage.getItem(
          "inukawaSurveyCompleted"
        ) === "true"
      );

    }


    /* =========================
       初回判定
       ========================= */

    function runAccessCheck() {

      const status =
        getGachaStatus();


      /* 開始前 */

      if (
        status === "before"
      ) {

        showAccessMessage(

          "まだ受付開始前です",

          "明日のテスト受付時間は<br><br>" +
          "<strong>10:00〜10:30</strong><br><br>" +
          "です。",

          "トップページへ戻る",

          "/inukawa_lp/index.html"

        );

        return false;

      }


      /* 終了後 */

      if (
        status === "after"
      ) {

        showAccessMessage(

          "受付は終了しました",

          "本日のアンケートガチャ受付は<br>" +
          "終了しました。",

          "トップページへ戻る",

          "/inukawa_lp/index.html"

        );

        return false;

      }


      /* アンケート未回答 */

      if (
        !hasSurveyCompleted()
      ) {

        showAccessMessage(

          "アンケート回答が必要です",

          "ガチャはアンケートに<br>" +
          "ご回答いただいた方のみ<br>" +
          "ご利用いただけます。",

          "アンケートへ進む",

          "/inukawa_lp/survey.html"

        );

        return false;

      }


      /* 正規ルート */

      showOnlyScreen(
        startScreen
      );

      return true;

    }


    /* =========================
       後半SCRIPTから使えるようにする
       ========================= */

    window.INUKAWA_GATE = {

      getStatus:
        getGachaStatus,

      hasSurveyCompleted:
        hasSurveyCompleted,

      showAccess:
        showAccessMessage,

      showScreen:
        showOnlyScreen,

      allowed:
        runAccessCheck()

    };

  </script>



  <!-- ==================================================
       ガチャ本体
       ================================================== -->

  <script>

    (function () {


      /* =========================
         受付条件NGなら
         ガチャ本体を起動しない
         ========================= */

      if (
        !window.INUKAWA_GATE ||
        !window.INUKAWA_GATE.allowed
      ) {

        return;

      }


      /* =========================
         Apps Script
         ========================= */

      const GACHA_API_URL =
        "https://script.google.com/macros/s/AKfycbxo5-G2MnqJh91QPobD1MnM3ueK6yp1dBwGD71w1lxFNS2b0n3A6xDLiD37Iyu9HowLIw/exec";


      /* =========================
         景品
         ========================= */

      const prizes = {

        first: {

          rank:
            "1等",

          image:
            "1.png",

          movie:
            "inkg2.mp4"

        },

        second: {

          rank:
            "2等",

          image:
            "2.png",

          movie:
            "inkg2.mp4"

        },

        third: {

          rank:
            "3等",

          image:
            "3.png",

          movie:
            "inkg2.mp4"

        },

        participation: {

          rank:
            "参加賞",

          image:
            "4.png",

          movie:
            "inkg1.mp4"

        }

      };


      /* =========================
         要素
         ========================= */

      const drawButton =
        document.getElementById(
          "drawButton"
        );

      const movie =
        document.getElementById(
          "gachaMovie"
        );

      const rank =
        document.getElementById(
          "rank"
        );

      const prizeImage =
        document.getElementById(
          "prizeImage"
        );

      const prizeBox =
        document.getElementById(
          "prizeBox"
        );

      const redeemButton =
        document.getElementById(
          "redeemButton"
        );

      const resultInner =
        document.getElementById(
          "resultInner"
        );


      let currentResult =
        null;

      let currentDrawId =
        null;


      /* =========================
         API通信
         ========================= */

      function requestApi(
        action,
        params
      ) {

        params =
          params || {};


        return new Promise(
          function (
            resolve,
            reject
          ) {


            const callbackName =
              "gachaCallback_" +
              Date.now() +
              "_" +
              Math.random()
                .toString(36)
                .slice(2);


            const script =
              document.createElement(
                "script"
              );


            let finished =
              false;


            const timer =
              setTimeout(
                function () {

                  cleanup();

                  reject(
                    new Error(
                      "通信タイムアウト"
                    )
                  );

                },
                10000
              );


            function cleanup() {

              if (finished) {
                return;
              }

              finished =
                true;


              clearTimeout(
                timer
              );


              try {

                delete window[
                  callbackName
                ];

              } catch (error) {

                window[
                  callbackName
                ] =
                  undefined;

              }


              if (
                script.parentNode
              ) {

                script.parentNode
                  .removeChild(
                    script
                  );

              }

            }


            window[
              callbackName
            ] =
              function (
                data
              ) {

                cleanup();

                resolve(
                  data
                );

              };


            script.onerror =
              function () {

                cleanup();

                reject(
                  new Error(
                    "通信エラー"
                  )
                );

              };


            let url =
              GACHA_API_URL +
              "?action=" +
              encodeURIComponent(
                action
              ) +
              "&callback=" +
              encodeURIComponent(
                callbackName
              ) +
              "&_=" +
              Date.now();


            Object.keys(
              params
            )
              .forEach(
                function (
                  key
                ) {

                  url +=
                    "&" +
                    encodeURIComponent(
                      key
                    ) +
                    "=" +
                    encodeURIComponent(
                      params[key]
                    );

                }
              );


            script.src =
              url;


            document.head
              .appendChild(
                script
              );

          }
        );

      }


      /* =========================
         ガチャを引く
         ========================= */

      drawButton.addEventListener(
        "click",
        async function () {


          /* 時間をもう一度確認 */

          const status =
            window
              .INUKAWA_GATE
              .getStatus();


          if (
            status !== "open"
          ) {

            window
              .INUKAWA_GATE
              .showAccess(

                "受付は終了しました",

                "現在ガチャをご利用いただけません。",

                "トップページへ戻る",

                "/inukawa_lp/index.html"

              );

            return;

          }


          /* アンケート確認 */

          if (
            !window
              .INUKAWA_GATE
              .hasSurveyCompleted()
          ) {

            window
              .INUKAWA_GATE
              .showAccess(

                "アンケート回答が必要です",

                "アンケート回答後に<br>" +
                "ガチャへ進んでください。",

                "アンケートへ進む",

                "/inukawa_lp/survey.html"

              );

            return;

          }


          drawButton.disabled =
            true;

          drawButton.textContent =
            "抽選中…";


          try {


            const data =
              await requestApi(
                "draw"
              );


            if (
              !data ||
              !data.success
            ) {

              alert(
                data &&
                data.message
                  ? data.message
                  : "抽選できませんでした"
              );


              drawButton.disabled =
                false;

              drawButton.textContent =
                "ガチャを引く";

              return;

            }


            currentResult =
              data.result;


            currentDrawId =
              data.drawId;


            if (
              !prizes[
                currentResult
              ]
            ) {

              throw new Error(
                "景品データがありません"
              );

            }


            if (
              !currentDrawId
            ) {

              throw new Error(
                "抽選IDがありません"
              );

            }


            /* =========================
               抽選成功後に通行証を消す
               ==============
